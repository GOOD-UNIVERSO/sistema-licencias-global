# This workflow will build and push a new container image to Amazon ECR,
# and then will deploy a new task definition to Amazon ECS, when there is a push to the "main" branch.
#
# To use this workflow, you will need to complete the following set-up steps:
#
# 1. Create an ECR repository to store your images.
#    For example: `aws ecr create-repository --repository-name my-ecr-repo --region us-east-2`.
#    Set the `ECR_REPOSITORY` repository variable with your repository's name.
#    Set the `AWS_REGION` repository variable with your repository's region.
#
# 2. Create an ECS task definition, an ECS cluster, and an ECS service.
#    For example, follow the Getting Started guide on the ECS console:
#      https://us-east-2.console.aws.amazon.com/ecs/home?region=us-east-2#/firstRun
#    Set the `ECS_SERVICE` repository variable with the name of your Amazon ECS service.
#    Set the `ECS_CLUSTER` repository variable with the name of your cluster.
#
# 3. Store your ECS task definition as a JSON file in your repository.
#    The format should follow the output of `aws ecs register-task-definition --generate-cli-skeleton`.
#    Set the `ECS_TASK_DEFINITION` repository variable with the path to the JSON file.
#    Set the `CONTAINER_NAME` repository variable with the name of the container
#    in the `containerDefinitions` section of your task definition.
#
# 4. Store an IAM user access key in GitHub Actions secrets named `AWS_ACCESS_KEY_ID` and `AWS_SECRET_ACCESS_KEY`.
#    See the documentation for each action used below for the recommended IAM policies for this IAM user,
#    and best practices on handling the access key credentials.
#
# 5. Set the following repository variables (Settings > Secrets and variables > Variables):
#    - AWS_REGION: Your AWS region (e.g., us-west-1)
#    - ECR_REPOSITORY: Your Amazon ECR repository name
#    - ECS_SERVICE: Your Amazon ECS service name
#    - ECS_CLUSTER: Your Amazon ECS cluster name
#    - ECS_TASK_DEFINITION: Path to your task definition file (e.g., .aws/task-definition.json)
#    - CONTAINER_NAME: Container name from your task definition

name: Deploy to Amazon ECS

on:
  push:
    branches: [ "main" ]

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_TASK_DEFINITION: ${{ vars.ECS_TASK_DEFINITION }}
  CONTAINER_NAME: ${{ vars.CONTAINER_NAME }}

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Validate configuration
      run: |
        required_vars=("AWS_REGION" "ECR_REPOSITORY" "ECS_SERVICE" "ECS_CLUSTER" "ECS_TASK_DEFINITION" "CONTAINER_NAME")
        missing_vars=()
        for var in "${required_vars[@]}"; do
          if [ -z "${!var}" ]; then
            missing_vars+=("$var")
          fi
        done
        if [ ${#missing_vars[@]} -gt 0 ]; then
          echo "❌ Error: Missing required repository variables:"
          for var in "${missing_vars[@]}"; do
            echo "  - $var"
          done
          echo ""
          echo "Please set these variables in Settings > Secrets and variables > Variables"
          exit 1
        fi
        echo "✅ All required configuration variables are set"

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        # Build a docker container and
        # push it to ECR so that it can
        # be deployed to ECS.
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
        echo "✅ Image built and pushed successfully"

    - name: Fill in the new image ID in the Amazon ECS task definition
      id: task-def
      uses: aws-actions/amazon-ecs-render-task-definition@v2
      with:
        task-definition: ${{ env.ECS_TASK_DEFINITION }}
        container-name: ${{ env.CONTAINER_NAME }}
        image: ${{ steps.build-image.outputs.image }}

    - name: Deploy Amazon ECS task definition
      uses: aws-actions/amazon-ecs-deploy-task-definition@v1
      with:
        task-definition: ${{ steps.task-def.outputs.task-definition }}
        service: ${{ env.ECS_SERVICE }}
        cluster: ${{ env.ECS_CLUSTER }}
        wait-for-service-stability: true

    - name: Deployment summary
      if: success()
      run: |
        echo "✅ Deployment completed successfully!"
        echo ""
        echo "📦 Deployment Details:"
        echo "  Image: ${{ steps.build-image.outputs.image }}"
        echo "  Cluster: ${{ env.ECS_CLUSTER }}"
        echo "  Service: ${{ env.ECS_SERVICE }}"
        echo "  Region: ${{ env.AWS_REGION }}"
        echo "  Commit: ${{ github.sha }}"
